[project]
name = "leetmind"
version = "0.1.0"
description = "Leetmind - a personalized LeetCode AI agent that answers questions about your own problems, lists, and submissions via tool calling."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kalpit" }]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "openai-agents>=0.0.10",
]

[project.scripts]
leetmind = "leetmind.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leetmind"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]
